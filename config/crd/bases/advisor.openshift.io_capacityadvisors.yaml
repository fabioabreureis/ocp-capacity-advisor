---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: capacityadvisors.advisor.openshift.io
spec:
  group: advisor.openshift.io
  names:
    kind: CapacityAdvisor
    listKind: CapacityAdvisorList
    plural: capacityadvisors
    singular: capacityadvisor
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.cluster.cpuUsagePercent
      name: CPU%
      type: number
    - jsonPath: .status.cluster.memoryUsagePercent
      name: Mem%
      type: number
    - jsonPath: .status.cluster.podsUsagePercent
      name: Pods%
      type: number
    - jsonPath: .status.recommendations.attention
      name: Attention
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CapacityAdvisor reports OpenShift cluster capacity vs request
          utilization.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CapacityAdvisorSpec = Target Utilization (os sliders do mockup).
              O operator compara o uso atual (requests / allocatable) com esses targets
              e calcula a capacidade adicional necessária.
            properties:
              cpuTargetPercent:
                default: 70
                description: |-
                  CPUTargetPercent is the desired max CPU request utilization (default 70).
                  Example: 70 means "try to keep requested CPU at or below 70% of allocatable".
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              memoryTargetPercent:
                default: 70
                description: MemoryTargetPercent is the desired max memory request
                  utilization (default 70).
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              podsTargetPercent:
                default: 80
                description: PodsTargetPercent is the desired max pod density (default
                  80).
                format: int32
                maximum: 100
                minimum: 1
                type: integer
            type: object
          status:
            description: CapacityAdvisorStatus is what the Overview dashboard would
              read.
            properties:
              cluster:
                description: Cluster-wide totals (top cards in the mockup).
                properties:
                  cpuUsagePercent:
                    description: CPUUsagePercent = requested / allocatable * 100.
                    type: number
                  memoryUsagePercent:
                    description: MemoryUsagePercent = requested / allocatable * 100.
                    type: number
                  nodesNotReady:
                    format: int32
                    type: integer
                  nodesReady:
                    format: int32
                    type: integer
                  nodesTotal:
                    format: int32
                    type: integer
                  podCapacity:
                    description: PodCapacity is Node allocatable pods summed (e.g.
                      4500).
                    format: int64
                    type: integer
                  podsUsagePercent:
                    description: PodsUsagePercent = running / capacity * 100.
                    type: number
                  requestedCPUCores:
                    description: RequestedCPUCores is the sum of Pod CPU requests
                      (e.g. 438).
                    type: number
                  requestedMemoryBytes:
                    description: RequestedMemoryBytes is the sum of Pod memory requests.
                    format: int64
                    type: integer
                  runningPods:
                    description: RunningPods counts non-terminal pods (Running + Pending).
                    format: int64
                    type: integer
                  totalCPUCores:
                    description: TotalCPUCores is Node allocatable CPU summed across
                      the cluster (e.g. 576).
                    type: number
                  totalMemoryBytes:
                    description: TotalMemoryBytes is Node allocatable memory (raw
                      bytes).
                    format: int64
                    type: integer
                required:
                - cpuUsagePercent
                - memoryUsagePercent
                - nodesNotReady
                - nodesReady
                - nodesTotal
                - podCapacity
                - podsUsagePercent
                - requestedCPUCores
                - requestedMemoryBytes
                - runningPods
                - totalCPUCores
                - totalMemoryBytes
                type: object
              conditions:
                description: Standard Kubernetes conditions (Ready, etc.).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedAt:
                description: 'ObservedAt is when this status was last computed ("Last
                  updated: 30s ago").'
                format: date-time
                type: string
              pools:
                description: Per MachineConfigPool breakdown (worker / infra / master
                  table).
                items:
                  description: PoolCapacity is one row in the "Capacity by MachineConfigPool"
                    table.
                  properties:
                    cpuUsagePercent:
                      type: number
                    memoryUsagePercent:
                      type: number
                    name:
                      description: Name of the MachineConfigPool (worker, infra, master,
                        ...).
                      type: string
                    nodes:
                      description: Nodes in this pool.
                      format: int32
                      type: integer
                    podCapacity:
                      format: int64
                      type: integer
                    podsUsagePercent:
                      type: number
                    recommendation:
                      description: 'Recommendation is a short human message: "Add
                        2 nodes", "Sufficient", "Consider upgrade".'
                      type: string
                    requestedCPUCores:
                      type: number
                    requestedMemoryBytes:
                      format: int64
                      type: integer
                    runningPods:
                      format: int64
                      type: integer
                    totalCPUCores:
                      type: number
                    totalMemoryBytes:
                      format: int64
                      type: integer
                  required:
                  - cpuUsagePercent
                  - memoryUsagePercent
                  - name
                  - nodes
                  - podCapacity
                  - podsUsagePercent
                  - recommendation
                  - requestedCPUCores
                  - requestedMemoryBytes
                  - runningPods
                  - totalCPUCores
                  - totalMemoryBytes
                  type: object
                type: array
              recommendations:
                description: Recommendations derived from Spec targets.
                properties:
                  additionalCPUCores:
                    description: AdditionalCPUCores needed to bring usage down to
                      the CPU target (0 if healthy).
                    type: number
                  additionalMemoryBytes:
                    description: AdditionalMemoryBytes needed for the memory target.
                    format: int64
                    type: integer
                  additionalPods:
                    description: AdditionalPods capacity needed for the pods target.
                    format: int64
                    type: integer
                  attention:
                    description: Attention is true when any resource is above its
                      target.
                    type: boolean
                  estimatedNodes:
                    description: EstimatedNodes is a rough "how many worker-sized
                      nodes" equivalent.
                    format: int32
                    type: integer
                  message:
                    description: Message is the banner text ("Additional capacity
                      is recommended." / healthy).
                    type: string
                required:
                - additionalCPUCores
                - additionalMemoryBytes
                - additionalPods
                - attention
                - estimatedNodes
                - message
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
